# Configuration exchange.
# Choix arrêté par ADR-002 (2026-07-06) : Bybit (licence MiCA France + testnet & demo mainnet).
exchange:
  id: bybit
  # Mode d'exécution : paper | testnet | live
  mode: paper
  # VERROU DE SÉCURITÉ (règle R6) : le mode live exige live_trading=true ET
  # la GO_LIVE_CHECKLIST complétée ET une confirmation explicite de l'utilisateur.
  # Ce flag n'est JAMAIS activé par le bot lui-même.
  live_trading: false

# Source des données historiques de backtest (ADR-002) : API publique Binance,
# sans clé — historique spot le plus profond (2017+). Cohérence vérifiée vs Bybit.
data:
  historical_source: binance_public
  # ADR-002 addendum : Bybit est géo-bloqué depuis l'environnement cloud (IP US).
  # Ici le paper consomme les données publiques Binance ; en production (France),
  # remettre live_source: bybit (cf. RUNBOOK).
  live_source: binance_public

fees:
  # Frais spot tier de base Bybit ET Binance : 0,10 % maker / 0,10 % taker.
  # Vérifiés le 2026-07-06 (2 sources chacun, cf. docs/RESEARCH.md §2).
  maker: 0.001
  taker: 0.001

slippage:
  # Slippage simulé en points de base, + composante proportionnelle au volume.
  base_bps: 5.0
  volume_impact: true
